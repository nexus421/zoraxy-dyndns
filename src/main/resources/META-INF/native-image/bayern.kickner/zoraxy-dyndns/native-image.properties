# Picked up automatically by native-image from the JAR.
# --enable-url-protocols=http is required: the plugin calls Zoraxy's API on http://127.0.0.1
# The two -D values repeat limitRequestTime() in Server.kt for the case that native-image initializes the JDK's
# HTTP server configuration at build time, Main sets them again at run time.
Args = --no-fallback -Os --enable-url-protocols=http -Dsun.net.httpserver.maxReqTime=5 -Dsun.net.httpserver.drainAmount=0
